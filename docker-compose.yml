# ==============================================================================
# Lenny Growth Assistant - Full-Stack Production & Local Docker Orchestration
# ==============================================================================
# Single Command Execution:
#   docker-compose up
#
# Services:
#   1. backend   - FastAPI REST API, Vector RAG Engine, Agent Router (Port 8000)
#   2. frontend  - React (Vite) Single Page App with Nginx Reverse Proxy (Port 3000)
#   3. postgres  - PostgreSQL 16 database (Optional if using Supabase) (Port 5432)
#   4. chroma    - Chroma Vector Database for Lenny transcript chunks (Port 8001)
#   5. ollama    - Optional local LLM container (profile: ollama) (Port 11434)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL Database (Optional - used when not connecting to Supabase)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: lenny-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-lenny_growth}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-lenny_growth}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - lenny-network

  # ----------------------------------------------------------------------------
  # 2. Chroma Vector Database (Persistent Knowledge Store)
  # ----------------------------------------------------------------------------
  chroma:
    image: chromadb/chroma:0.6.3
    container_name: lenny-chromadb
    restart: unless-stopped
    environment:
      IS_PERSISTENT: "TRUE"
      ANONYMIZED_TELEMETRY: "FALSE"
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    networks:
      - lenny-network

  # ----------------------------------------------------------------------------
  # 3. FastAPI Backend Service
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: lenny-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      # If DOCKER_DATABASE_URL is set (e.g. Supabase pooler), it is used; otherwise defaults to the local postgres container
      - DATABASE_URL=${DOCKER_DATABASE_URL:-postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-lenny_growth}}
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - CHROMA_COLLECTION_NAME=${CHROMA_COLLECTION_NAME:-lenny_growth_knowledge}
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - OPENAI_EMBEDDING_MODEL=${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      - OLLAMA_BASE_URL=${DOCKER_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1:8b}
      - OLLAMA_EMBEDDING_MODEL=${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      - OLLAMA_TIMEOUT_SECONDS=${OLLAMA_TIMEOUT_SECONDS:-120.0}
      - ALLOWED_CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000"]
    depends_on:
      postgres:
        condition: service_started
        required: false
      chroma:
        condition: service_started
    extra_hosts:
      # Resolves host machine from inside Docker container for Ollama running on host OS
      - "host.docker.internal:host-gateway"
    networks:
      - lenny-network

  # ----------------------------------------------------------------------------
  # 4. React (Vite) Frontend Service
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        - VITE_API_BASE_URL=http://localhost:8000/api/v1
    container_name: lenny-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
    networks:
      - lenny-network

  # ----------------------------------------------------------------------------
  # 5. Optional In-Docker Ollama Service (profile: ollama)
  # Run: docker compose --profile ollama up
  # ----------------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: lenny-ollama
    profiles:
      - ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - lenny-network

# ==============================================================================
# Networks & Volumes
# ==============================================================================
networks:
  lenny-network:
    name: lenny-growth-network
    driver: bridge

volumes:
  postgres_data:
    name: lenny-postgres-data
    driver: local
  chroma_data:
    name: lenny-chroma-data
    driver: local
  ollama_models:
    name: lenny-ollama-models
    driver: local
